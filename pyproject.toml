[project]
name = "uart-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "instro>=1.21.0",
    "numpy>=2.5.4",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6-essentials>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
